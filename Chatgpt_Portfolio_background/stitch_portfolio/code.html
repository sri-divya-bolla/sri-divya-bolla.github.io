<style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #050608;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Multi-phase twinkling star scintillation */
    @keyframes starPulseVeryFast {
      0%, 100% { opacity: 0.2; transform: scale(0.75); }
      50% { opacity: 0.95; transform: scale(1.25); filter: drop-shadow(0 0 4px rgba(255,255,255,0.9)); }
    }
    @keyframes starPulseFast {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.95; transform: scale(1.15); filter: drop-shadow(0 0 3px rgba(255,255,255,0.8)); }
    }
    @keyframes starPulseMedium {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.2); filter: drop-shadow(0 0 5px rgba(180,230,255,0.7)); }
    }
    @keyframes starPulseSlow {
      0%, 100% { opacity: 0.15; transform: scale(0.85); }
      50% { opacity: 0.85; transform: scale(1.15); filter: drop-shadow(0 0 6px rgba(255,216,168,0.7)); }
    }

    .star-twinkle-vfast { animation: starPulseVeryFast 1.6s ease-in-out infinite; }
    .star-twinkle-fast { animation: starPulseFast 2.6s ease-in-out infinite; }
    .star-twinkle-medium { animation: starPulseMedium 4.2s ease-in-out infinite; }
    .star-twinkle-slow { animation: starPulseSlow 6.0s ease-in-out infinite; }

    /* Diffraction spike cross */
    .diffraction-spike::before,
    .diffraction-spike::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.95), transparent);
    }
    .diffraction-spike::before {
      width: 24px;
      height: 1px;
    }
    .diffraction-spike::after {
      width: 1px;
      height: 24px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.95), transparent);
    }

    .diffraction-spike-lg::before { width: 36px; height: 1.2px; }
    .diffraction-spike-lg::after { width: 1.2px; height: 36px; }
  </style>
</head>

<div class="absolute bottom-[44%] right-[28%] star-twinkle-vfast" style="animation-delay: 2.1s;">

<div class="absolute top-[78%] left-[36%] star-twinkle-medium" style="animation-delay: 3.5s;">

<div class="absolute bottom-[15%] right-[12%] star-twinkle-fast" style="animation-delay: 1.4s;">

<div class="absolute top-[24%] left-[62%] star-twinkle-slow" style="animation-delay: 0.8s;">

</div>
<script>
    // Authentic Astronomical Meteor Shower Simulation
    // Real Meteor Shower Spectroscopy & Shared Celestial Radiant Point:
    // All meteors originate from a coherent shower radiant in the celestial upper-right (~30° to 38° descent slope).
    // Atomic Ion Emission Lines:
    //  - Magnesium (Mg I / Mg II): Luminous bright turquoise/emerald core emission
    //  - Sodium (Na I D-line): Golden amber / warm solar topaz flare
    //  - Ionized Oxygen ([O I] / O II): Vivid Cyan / Aurora teal
    //  - Calcium (Ca I / Ca II+): Soft ethereal violet / lilac ion wake
    //  - Nitrogen (N2 1P / N II): Icy electric sapphire / azure-white ion fringe
    //  - Iron (Fe I): Warm incandescent yellow-white nucleus

    const ASTRONOMICAL_EMISSION_PALETTES = [
      {
        element: 'Magnesium (Mg I/II Emerald)',
        coreHot: '#ffffff',
        nucleusTint: '#e6fffa',
        glowColor: 'rgba(52, 211, 153, 0.50)',
        diffuseColor: 'rgba(16, 185, 129, 0.22)',
        glowSize: 6.8,
        stops: [
          { pos: 0.0, color: (a) => `rgba(255, 255, 255, ${a * 0.98})` },
          { pos: 0.08, color: (a) => `rgba(209, 250, 229, ${a * 0.92})` },
          { pos: 0.28, color: (a) => `rgba(52, 211, 153, ${a * 0.78})` },
          { pos: 0.58, color: (a) => `rgba(16, 185, 129, ${a * 0.45})` },
          { pos: 0.85, color: (a) => `rgba(5, 150, 105, ${a * 0.18})` },
          { pos: 1.0, color: () => `rgba(4, 120, 87, 0)` }
        ]
      },
      {
        element: 'Sodium (Na I D-line Amber)',
        coreHot: '#fffdf5',
        nucleusTint: '#fef3c7',
        glowColor: 'rgba(255, 209, 102, 0.50)',
        diffuseColor: 'rgba(245, 158, 11, 0.20)',
        glowSize: 7.2,
        stops: [
          { pos: 0.0, color: (a) => `rgba(255, 255, 255, ${a * 0.98})` },
          { pos: 0.08, color: (a) => `rgba(254, 243, 199, ${a * 0.90})` },
          { pos: 0.28, color: (a) => `rgba(255, 209, 102, ${a * 0.74})` },
          { pos: 0.60, color: (a) => `rgba(245, 158, 11, ${a * 0.42})` },
          { pos: 0.86, color: (a) => `rgba(217, 119, 6, ${a * 0.16})` },
          { pos: 1.0, color: () => `rgba(180, 83, 9, 0)` }
        ]
      },
      {
        element: 'Ionized Oxygen (Cyan/Teal)',
        coreHot: '#ffffff',
        nucleusTint: '#e0f2fe',
        glowColor: 'rgba(56, 189, 248, 0.48)',
        diffuseColor: 'rgba(14, 165, 233, 0.20)',
        glowSize: 6.6,
        stops: [
          { pos: 0.0, color: (a) => `rgba(255, 255, 255, ${a * 0.98})` },
          { pos: 0.08, color: (a) => `rgba(224, 242, 254, ${a * 0.90})` },
          { pos: 0.30, color: (a) => `rgba(56, 189, 248, ${a * 0.72})` },
          { pos: 0.60, color: (a) => `rgba(14, 165, 233, ${a * 0.40})` },
          { pos: 0.85, color: (a) => `rgba(2, 132, 199, ${a * 0.15})` },
          { pos: 1.0, color: () => `rgba(3, 105, 161, 0)` }
        ]
      },
      {
        element: 'Calcium (Ca / Ca+ Violet)',
        coreHot: '#ffffff',
        nucleusTint: '#f3e8ff',
        glowColor: 'rgba(192, 132, 252, 0.46)',
        diffuseColor: 'rgba(168, 85, 247, 0.18)',
        glowSize: 6.8,
        stops: [
          { pos: 0.0, color: (a) => `rgba(255, 255, 255, ${a * 0.98})` },
          { pos: 0.08, color: (a) => `rgba(243, 232, 255, ${a * 0.90})` },
          { pos: 0.28, color: (a) => `rgba(192, 132, 252, ${a * 0.72})` },
          { pos: 0.58, color: (a) => `rgba(168, 85, 247, ${a * 0.40})` },
          { pos: 0.85, color: (a) => `rgba(126, 34, 206, ${a * 0.15})` },
          { pos: 1.0, color: () => `rgba(88, 28, 135, 0)` }
        ]
      },
      {
        element: 'Atmospheric Nitrogen (Ice Electric Azure)',
        coreHot: '#ffffff',
        nucleusTint: '#f0f9ff',
        glowColor: 'rgba(96, 165, 250, 0.46)',
        diffuseColor: 'rgba(37, 99, 235, 0.18)',
        glowSize: 6.8,
        stops: [
          { pos: 0.0, color: (a) => `rgba(255, 255, 255, ${a * 0.98})` },
          { pos: 0.09, color: (a) => `rgba(219, 234, 254, ${a * 0.90})` },
          { pos: 0.29, color: (a) => `rgba(96, 165, 250, ${a * 0.70})` },
          { pos: 0.60, color: (a) => `rgba(59, 130, 246, ${a * 0.38})` },
          { pos: 0.88, color: (a) => `rgba(29, 78, 216, ${a * 0.14})` },
          { pos: 1.0, color: () => `rgba(30, 64, 175, 0)` }
        ]
      },
      {
        element: 'Iron (Fe I Incandescent Nucleus)',
        coreHot: '#ffffff',
        nucleusTint: '#fffbeb',
        glowColor: 'rgba(254, 240, 138, 0.45)',
        diffuseColor: 'rgba(250, 204, 21, 0.18)',
        glowSize: 7.2,
        stops: [
          { pos: 0.0, color: (a) => `rgba(255, 255, 255, ${a * 0.98})` },
          { pos: 0.10, color: (a) => `rgba(254, 249, 195, ${a * 0.88})` },
          { pos: 0.32, color: (a) => `rgba(253, 224, 71, ${a * 0.70})` },
          { pos: 0.65, color: (a) => `rgba(234, 179, 8, ${a * 0.38})` },
          { pos: 0.88, color: (a) => `rgba(161, 98, 7, ${a * 0.14})` },
          { pos: 1.0, color: () => `rgba(113, 63, 18, 0)` }
        ]
      }
    ];

    function pickRandomPalette() {
      return ASTRONOMICAL_EMISSION_PALETTES[Math.floor(Math.random() * ASTRONOMICAL_EMISSION_PALETTES.length)];
    }

    const canvas = document.getElementById('meteorCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class CelestialMeteor {
      constructor(initialDelay = 0, isPreWarmed = false) {
        this.reset(initialDelay, isPreWarmed);
      }

      reset(customDelay = null, isPreWarmed = false) {
        // Shared Shower Radiant Geometry:
        // Coherent atmospheric radiant angle (~31° to 37° downward pitch toward lower left)
        const radiantBaseAngle = 148;
        const angleDeg = radiantBaseAngle + (Math.random() * 5 - 2.5);
        this.angle = (Math.PI / 180) * angleDeg;

        // Broad atmospheric dispersion across all regions of the sky
        const spawnType = Math.random();
        if (spawnType < 0.38) {
          // Celestial top entry spanning the sky
          this.x = width * (0.05 + Math.random() * 0.98);
          this.y = -30 - Math.random() * 80;
        } else if (spawnType < 0.70) {
          // Upper & mid-right celestial horizon entry
          this.x = width + 25 + Math.random() * 60;
          this.y = Math.random() * (height * 0.65);
        } else {
          // Upper-mid sky gentle atmospheric ignition (high altitude)
          this.x = width * (0.25 + Math.random() * 0.75);
          this.y = height * (0.02 + Math.random() * 0.45);
        }

        // Exact ultra-slow, majestic velocity preserved (~0.32 to 0.54 px/frame at 60fps)
        this.baseSpeed = 0.32 + Math.random() * 0.22;
        this.currentSpeed = this.baseSpeed;

        // Proportions: Variable celestial depths from faint distant whispers to closer gleaming bolides
        const depthFactor = 0.75 + Math.random() * 0.55;
        this.length = (110 + Math.random() * 75) * depthFactor;
        this.thickness = (0.9 + Math.random() * 0.4) * depthFactor;
        this.nucleusRadius = (0.7 + Math.random() * 0.45) * depthFactor;

        // Serene trajectory distance
        this.maxTravel = 560 + Math.random() * 480;
        this.distanceTravelled = 0;
        this.opacity = 0;
        this.maxOpacity = 0.65 + Math.random() * 0.30;

        // Ion spectroscopy palette
        this.palette = pickRandomPalette();

        if (isPreWarmed) {
          // Spread immediately across flight paths on first load so 6-12+ are instantly gliding
          this.state = 'active';
          this.distanceTravelled = Math.random() * (this.maxTravel * 0.85);
          const vx = Math.cos(this.angle) * this.distanceTravelled;
          const vy = Math.sin(this.angle) * this.distanceTravelled;
          this.x += vx;
          this.y += vy;
          this.updateOpacity();
        } else {
          // Staggered frequent continuous re-spawns
          this.state = 'idle';
          const delay = customDelay !== null ? customDelay : 200 + Math.random() * 3200;
          this.startTime = performance.now() + delay;
        }
      }

      updateOpacity() {
        const progress = this.distanceTravelled / this.maxTravel;
        // Realistic Ionization Light-Curve:
        // 1. Initial faint atmospheric compression heating (0% - 15%)
        // 2. Full ablation & incandescent ionization plateau (15% - 75%)
        // 3. Vapor diffusion and gradual fade (75% - 100%)
        if (progress < 0.15) {
          this.opacity = Math.sin((progress / 0.15) * (Math.PI / 2)) * this.maxOpacity;
        } else if (progress > 0.75) {
          const fade = (progress - 0.75) / 0.25;
          this.opacity = Math.cos(fade * (Math.PI / 2)) * this.maxOpacity;
        } else {
          this.opacity = this.maxOpacity;
        }
      }

      update(now) {
        if (this.state === 'idle') {
          if (now >= this.startTime) {
            this.state = 'active';
            this.distanceTravelled = 0;
          } else {
            return;
          }
        }

        if (this.state === 'active') {
          const progress = this.distanceTravelled / this.maxTravel;

          // Gentle physics ease
          const speedMultiplier = 1.01 - (progress * 0.05);
          this.currentSpeed = this.baseSpeed * Math.max(0.86, speedMultiplier);

          const vx = Math.cos(this.angle) * this.currentSpeed;
          const vy = Math.sin(this.angle) * this.currentSpeed;

          this.x += vx;
          this.y += vy;
          this.distanceTravelled += this.currentSpeed;

          this.updateOpacity();

          if (progress >= 1 || this.x < -320 || this.y > height + 320) {
            this.opacity = 0;
            this.reset();
          }
        }
      }

      draw(ctx) {
        if (this.state !== 'active' || this.opacity <= 0.005) return;

        ctx.save();

        // Length ramps in gracefully with distance travelled
        const progress = Math.min(1, this.distanceTravelled / (this.maxTravel * 0.18));
        const effectiveLength = this.length * Math.max(0.28, progress);

        const tailX = this.x - Math.cos(this.angle) * effectiveLength;
        const tailY = this.y - Math.sin(this.angle) * effectiveLength;

        // 1. Gossamer outer ionization wake (soft diffused atmospheric plasma sheath)
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = this.palette.diffuseColor;
        ctx.lineWidth = this.thickness * 2.8;
        ctx.lineCap = 'round';
        ctx.globalAlpha = this.opacity * 0.40;
        ctx.stroke();

        // 2. High-fidelity spectroscopic emission trail (core chemical color gradient)
        ctx.globalAlpha = 1.0;
        const trailGrad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        for (let i = 0; i < this.palette.stops.length; i++) {
          const s = this.palette.stops[i];
          trailGrad.addColorStop(s.pos, s.color(this.opacity));
        }

        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = trailGrad;
        ctx.lineWidth = this.thickness;
        ctx.lineCap = 'round';
        ctx.stroke();

        // 3. Vaporized atmospheric glow halo
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.nucleusRadius * 1.6, 0, Math.PI * 2);
        ctx.fillStyle = this.palette.glowColor;
        ctx.shadowColor = this.palette.glowColor;
        ctx.shadowBlur = this.palette.glowSize;
        ctx.fill();

        // 4. Incandescent white-hot ablation nucleus (diamond micro-core)
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.nucleusRadius, 0, Math.PI * 2);
        ctx.fillStyle = this.palette.coreHot;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 3.5;
        ctx.fill();

        ctx.restore();
      }
    }

    // Increased meteor population (~2.8x density) to guarantee 8-14 meteors always visible simultaneously
    const meteorCount = 30;
    const meteors = [];

    // Pre-warm a rich set of meteors so upon load there is an active cosmic field immediately
    for (let i = 0; i < meteorCount; i++) {
      if (i < 12) {
        // Pre-warmed actively gliding meteors in mid-sky across depths
        meteors.push(new CelestialMeteor(0, true));
      } else {
        // Staggered continuous spawns with rapid intervals
        const initialStagger = (i - 12) * 550 + Math.random() * 400;
        meteors.push(new CelestialMeteor(initialStagger, false));
      }
    }

    function animate(now) {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < meteors.length; i++) {
        meteors[i].update(now);
        meteors[i].draw(ctx);
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
